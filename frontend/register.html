<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Member Registration - Nusrat French Club</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            🇫🇷 French Club
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <!-- REGISTRATION -->

    <main class="form-page">

        <div class="form-container">

            <h1>Member Registration</h1>

            <p class="form-description">
                Register as a member of the French Club.
            </p>


            <form id="registrationForm">

                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter full name"
                        required
                    >

                </div>


                <!-- GR NUMBER -->

                <div class="form-group">

                    <label for="grNumber">
                        GR Number
                    </label>

                    <input
                        type="text"
                        id="grNumber"
                        name="grNumber"
                        placeholder="Example: GR-001"
                        required
                    >

                </div>


                <!-- CLASS -->

                <div class="form-group">

                    <label for="class">
                        Class
                    </label>

                    <select
                        id="class"
                        name="class"
                        required
                    >

                        <option value="">
                            Select your class
                        </option>

                        <option value="Grade 10">
                            Grade 10
                        </option>

                        <option value="Grade 11">
                            Grade 11
                        </option>

                        <option value="Grade 12">
                            Grade 12
                        </option>

                    </select>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email address"
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Register
                </button>


                <!-- MESSAGE -->

                <p id="registrationMessage"></p>

            </form>


            <p class="login-link">

                Already registered?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 French Club Management System
        </p>

    </footer>


<script src="js/register.js"></script>
</body>

</html>
