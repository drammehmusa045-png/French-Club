
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - French Club</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

        <div class="logo">
            🇫🇷 French Club
        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

        </nav>

    </header>



    <!-- =====================================================
         LOGIN
         ===================================================== -->

    <main class="form-page">

        <div class="form-container">

            <h1>
                Member Login
            </h1>


            <p class="form-description">
                Login to your French Club account.
            </p>


            <form id="loginForm">


                <!-- =================================================
                     GR NUMBER
                     ================================================= -->

                <div class="form-group">

                    <label for="grNumber">
                        GR Number
                    </label>

                    <input
                        type="text"
                        id="grNumber"
                        placeholder="Enter your GR number"
                        required
                    >

                </div>



                <!-- =================================================
                     PASSWORD
                     ================================================= -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>



                <!-- =================================================
                     LOGIN BUTTON
                     ================================================= -->

                <button
                    type="submit"
                    class="submit-btn"
                >
                    Login
                </button>


                <!-- =================================================
                     LOGIN MESSAGE
                     ================================================= -->

                <p id="loginMessage"></p>


            </form>


        </div>

    </main>



    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        <p>
            © 2026 French Club Management System
        </p>

        <p>
            Managed by the French Club Executives
        </p>

    </footer>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/login.js"></script>

</body>

</html>
